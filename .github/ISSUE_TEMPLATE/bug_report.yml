name: turtle-lib Bug Report
description: Report reproducible turtle-lib issues so we can fix them quickly.
labels: [bug]
title: "[bug] <short summary>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with **turtle-lib**. Please complete every relevant field so we can reproduce the problem quickly.
  - type: input
    id: server_version
    attributes:
      label: Server Version
      description: Include the full Paper version string (e.g., git-Paper-123 1.21.1-R0.1-SNAPSHOT).
      placeholder: "Paper 1.21.10"
    validations:
      required: true
  - type: input
    id: turtlelib_version
    attributes:
      label: turtle-lib Version
      description: Which turtle-lib release or commit are you using? Include the commit hash if you built from source.
      placeholder: "v0.6.2-build.4"
    validations:
      required: true
  - type: input
    id: downstream_plugin
    attributes:
      label: Downstream Plugin / Project
      description: Name and version of the plugin or project that depends on turtle-lib.
      placeholder: "Timberella v1.5.0"
    validations:
      required: true
  - type: textarea
    id: api_usage
    attributes:
      label: Relevant API Usage
      description: List the turtle-lib modules or APIs you call (include code snippets if helpful).
      placeholder: |
        Using UpdateChecker#create(...) from module xyz
        Custom event listener hooking into tree registry
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Observed Behaviour
      description: Describe what happened, including any errors.
      placeholder: Clear, concise description of the incorrect behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: Tell us what you expected turtle-lib (and your plugin) to do instead.
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a numbered list of steps that reliably reproduces the issue.
      placeholder: |
        1. Install turtle-lib ...
        2. Call the UpdateChecker ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any stack traces or relevant console output (use code fences).
      render: shell
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Add any other context or screenshots that might help.
    validations:
      required: false
